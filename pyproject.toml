[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Permite instalar o projeto em modo editavel (pip install -e .), assim os
# pacotes "src" e "database" ficam importaveis de qualquer diretorio
[project]
name = "tcc-desenvolvimento"
version = "0.1.0"
requires-python = ">=3.12"

# Dependencias opcionais. O HMM em GPU (src/models/hmm/hmm.py) usa cupy, que exige
# driver NVIDIA + CUDA. Instalar com: pip install -e ".[gpu]"
# O nome do pacote depende da versao do CUDA: cupy-cuda12x (CUDA 12) ou
# cupy-cuda13x (CUDA 13). O hmm_numba.py roda em CPU e nao precisa dele.
[project.optional-dependencies]
gpu = ["cupy-cuda12x"]

[tool.setuptools.packages.find]
include = ["src*", "database*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
